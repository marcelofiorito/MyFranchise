_schema-version: "3.2"
ID: myfranchise
version: 1.0.0
description: RunMyFranchise — Gestão de Redes de Franquias no SAP BTP

parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx -p @sap/cds-dk cds build --production

modules:
  # --------------------- SERVER MODULE ------------------------
  - name: myfranchise-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: myfranchise-db
      - name: myfranchise-uaa
      - name: myfranchise-aicore
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    build-parameters:
      builder: npm-ci
      ignore: ["node_modules/"]

  # --------------------- MCP SERVER (SAP Joule) ----------------
  - name: myfranchise-mcp
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      command: node srv/mcp-server.js
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm-ci
      ignore:
        - node_modules/
        - gen/
        - app/
        - mta_archives/
        - .MyFranchise_mta_build_tmp/
    provides:
      - name: mcp-api
        properties:
          mcp-url: ${default-url}
    requires:
      - name: myfranchise-db
      - name: myfranchise-uaa

  # -------------------- DB DEPLOYER (HANA) --------------------
  - name: myfranchise-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: myfranchise-db
    build-parameters:
      ignore: ["node_modules/"]

  # ------------------ APPLICATION CONTENT ---------------------
  # Publica os 4 apps HTML5 no repo (html5-repo-host)
  - name: myfranchise-appcontent
    type: com.sap.application.content
    path: gen
    requires:
      - name: myfranchise-destination-service
      - name: myfranchise-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: app/
      requires:
        - name: network
          artifacts: [network.zip]
          target-path: app/
        - name: compliance
          artifacts: [compliance.zip]
          target-path: app/
        - name: franchisee
          artifacts: [franchisee.zip]
          target-path: app/
        - name: onboarding
          artifacts: [onboarding.zip]
          target-path: app/
        - name: recommendations
          artifacts: [recommendations.zip]
          target-path: app/
        - name: inventory
          artifacts: [inventory.zip]
          target-path: app/
        - name: replenishment
          artifacts: [replenishment.zip]
          target-path: app/

  # ------------- APPS FIORI (build → dist) --------------------
  - name: network
    type: html5
    path: app/network
    build-parameters:
      build-result: dist
      builder: custom
      commands: [npm install, npm run build]
      supported-platforms: []

  - name: compliance
    type: html5
    path: app/compliance
    build-parameters:
      build-result: dist
      builder: custom
      commands: [npm install, npm run build]
      supported-platforms: []

  - name: franchisee
    type: html5
    path: app/franchisee
    build-parameters:
      build-result: dist
      builder: custom
      commands: [npm install, npm run build]
      supported-platforms: []

  - name: onboarding
    type: html5
    path: app/onboarding
    build-parameters:
      build-result: dist
      builder: custom
      commands: [npm install, npm run build]
      supported-platforms: []

  - name: recommendations
    type: html5
    path: app/recommendations
    build-parameters:
      build-result: dist
      builder: custom
      commands: [npm install, npm run build]
      supported-platforms: []

  - name: inventory
    type: html5
    path: app/inventory
    build-parameters:
      build-result: dist
      builder: custom
      commands: [npm install, npm run build]
      supported-platforms: []

  - name: replenishment
    type: html5
    path: app/replenishment
    build-parameters:
      build-result: dist
      builder: custom
      commands: [npm install, npm run build]
      supported-platforms: []

  # ------------------ DESTINATION CONTENT ---------------------
  # Cria os destinations html5-repo + uaa no destination-service
  - name: myfranchise-destinationcontent
    type: com.sap.application.content
    build-parameters:
      no-source: true
    requires:
      - name: myfranchise-uaa
        parameters:
          service-key:
            name: myfranchise-uaa-key
      - name: myfranchise-html5-repo-host
        parameters:
          service-key:
            name: myfranchise-html5-repo-host-key
      - name: myfranchise-destination-service
        parameters:
          content-target: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: myfranchise-html5-repository
              ServiceInstanceName: myfranchise-html5-repo-host
              ServiceKeyName: myfranchise-html5-repo-host-key
              sap.cloud.service: myfranchise.service
            - Name: myfranchise-uaa
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: myfranchise-uaa
              ServiceKeyName: myfranchise-uaa-key
              sap.cloud.service: myfranchise.service

resources:
  # ------------------ HANA HDI Container ----------------------
  - name: myfranchise-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  # ------------------------ XSUAA -----------------------------
  - name: myfranchise-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: myfranchise-${space}
        tenant-mode: dedicated
        role-collections:
          - name: 'MyFranchise_Gestor_${space}'
            description: Gestor da Franqueadora
            role-template-references:
              - $XSAPPNAME.Franqueadora_Gestor
          - name: 'MyFranchise_Franqueado_${space}'
            description: Franqueado
            role-template-references:
              - $XSAPPNAME.Franqueado

  # ---------------- HTML5 Repo (runtime) ----------------------
  - name: myfranchise-html5-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # ---------------- HTML5 Repo (host) -------------------------
  - name: myfranchise-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ------------------ Destination Service ---------------------
  # Cria o destination srv-api (dinâmico) + habilita HTML5 runtime
  - name: myfranchise-destination-service
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        version: 1.0.0
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: myfranchise-srv
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true

  # ------------- AI Core (REUSA default_aicore) ---------------
  - name: myfranchise-aicore
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: default_aicore
